name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # `--locked` fails if uv.lock has drifted from pyproject.toml.
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy

      # Only one captured run is in git; tests that need the rest of the
      # corpus skip themselves. None of them call a model or GitHub.
      - name: Test
        run: uv run pytest -q -rs
