[project]
name = "ci-triage"
version = "0.1.0"
description = "A GitHub App that triages failed CI runs: categorises the failure, cites log evidence, and routes low-confidence verdicts to a human."
readme = "README.md"
authors = [
    { name = "Yosr", email = "yosr.kharrat@insat.ucar.tn" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "logfire>=5.1.0",
    "pydantic>=2.13.5",
    "pydantic-ai-slim[anthropic,google,groq,openai]>=2.46.0",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
    "uvicorn>=0.30",
]

[project.scripts]
ci-triage = "ci_triage.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.1.1",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    # `typer.Option(...)` as a default is how Typer declares a parameter.
    "B008",
    # `StrEnum` changes what `str()` returns, and category values reach the
    # cache key and stored reports.
    "UP042",
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
